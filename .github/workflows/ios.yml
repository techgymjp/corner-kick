name: iOS build

# iOS 版をビルドする。
# - Secrets(配布用の証明書と App Store Connect の API キー)があるとき: 本番広告の設定でビルドして署名し、
#   App Store Connect(TestFlight)にアップロードする。審査への提出は App Store Connect で行う
# - Secrets がないとき: 署名なしで、シミュレーター向けにビルドできるかだけを確認する
# 手順と Secrets の作り方は docs/IOS_BUILD.md の 8 章
on:
  push:
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'manifest.json'
      - 'vendor/**'
      - 'ios/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

# アップロードの途中で取り消さないよう、新しい push は前の実行が終わるのを待つ
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

# bash を pipefail で動かす(xcodebuild … | tail の xcodebuild が失敗したら、ステップも失敗させる)
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.ASC_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      # ---------- Secrets がないとき: ビルドできるかの確認だけ ----------
      - name: Copy web assets into the iOS project (test ads)
        if: env.HAS_SIGNING != 'true'
        run: |
          npm run build
          npx cap sync ios

      - name: Build for the simulator (no signing)
        if: env.HAS_SIGNING != 'true'
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40

      # ---------- Secrets があるとき: 本番広告でビルドして TestFlight へ ----------
      - name: Copy web assets into the iOS project (production ads)
        if: env.HAS_SIGNING == 'true'
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          # Mac から手でアップロードした番号(1, 2, 3…)とぶつからないよう 100 を足す
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          ADMOB_MODE=production npm run build
          npx cap sync ios

      # 配布用の証明書を、この実行だけで使うキーチェーンに入れる
      - name: Install the distribution certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # 署名用のプロファイルを自動で作る・アップロードするのに使う API キー
      - name: Write the App Store Connect API key
        if: env.HAS_SIGNING == 'true'
        env:
          P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "$P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # Archive は署名なしで作り、次の「アップロード」で配布用の証明書で署名する。
      # (Archive のときに自動署名させると開発用の証明書を新しく作ろうとし、証明書の数の上限で失敗する)
      - name: Archive (unsigned)
        if: env.HAS_SIGNING == 'true'
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="$VERSION_NAME" \
            archive | tail -60
          test -d "$RUNNER_TEMP/App.xcarchive"  # Archive ができていなければ失敗させる

      - name: Upload to App Store Connect (TestFlight)
        if: env.HAS_SIGNING == 'true'
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>GNM3VTX9YG</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -60
          echo "### TestFlight にアップロードしました: v${VERSION_NAME} (build ${BUILD_NUMBER})" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up the keychain and API key
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
